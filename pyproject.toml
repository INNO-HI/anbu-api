[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anbu-api"
version = "0.1.0"
description = "제주 안부똑똑 데이터 관리·전송 체계 (동국대학교 COSS사업단)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
