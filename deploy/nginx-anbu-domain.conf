# anbu-api 도메인 서비스 — /etc/nginx/sites-available/anbu-domain
# server_name 기반 가상호스트라 기존 443 사이트(if-night.com 등)와 공존한다.
# certbot --nginx 실행 시 이 파일에 443 ssl 블록과 80→443 리다이렉트가 자동 추가된다.

server {
    listen 80;
    listen [::]:80;
    server_name dashddokddok.safe-hi.xyz;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8201;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
