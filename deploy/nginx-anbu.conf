# anbu-api 리버스 프록시 (HTTPS 종단) — /etc/nginx/sites-available/anbu
#
# 주의: 이 서버는 공용 호스트로 80/443은 기존 사이트(if-night.com, sister.ai.kr,
# ifnight-ip 등)가 이미 사용 중이다. 기존 서비스를 깨지 않도록 anbu는 전용 포트
# 8443(HTTPS)으로 서비스한다. 접속: https://1.214.89.64:8443
# 바이너리 IP라 Let's Encrypt 불가 → self-signed 인증서(브라우저 경고, 암호화는 정상).

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name 1.214.89.64;

    ssl_certificate     /etc/nginx/ssl/anbu.crt;
    ssl_certificate_key /etc/nginx/ssl/anbu.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8201;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
